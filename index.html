<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>경기지역화폐 가맹점 지도</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    #map { position: fixed; inset: 0; background: #e8e8e8; }

    /* Bottom panel */
    #bottom-panel {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(100%);
      will-change: transform;
    }
    #bottom-panel.open { transform: translateY(0); }

    /* Filter buttons */
    .filter-btn { white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s; }
    .filter-btn.active { background: #2563eb !important; color: #fff !important; border-color: #2563eb !important; }

    /* Hide scrollbar on filter row */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-anim { animation: spin 0.9s linear infinite; }

    /* Map config-error screen */
    #config-error { display: none; }
  </style>
</head>
<body>

  <!-- ── Map ────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- Config-error fallback (shown when API keys are missing) -->
  <div id="config-error" class="fixed inset-0 bg-gray-100 z-50 flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center">
      <div class="text-5xl mb-4">🗺️</div>
      <h2 class="text-xl font-bold text-gray-800 mb-2">API 키 설정 필요</h2>
      <p class="text-sm text-gray-500 mb-5">
        <code class="bg-gray-100 px-1 rounded">config.js</code> 파일에 아래 키를 입력해주세요.
      </p>
      <div class="bg-gray-50 rounded-xl p-4 text-left text-xs font-mono text-gray-600 space-y-1">
        <p>NAVER_MAP_CLIENT_ID</p>
        <p>KAKAO_REST_API_KEY</p>
        <p>GGDATA_API_KEY</p>
      </div>
      <p class="mt-4 text-xs text-gray-400">로컬 실행 시 간단한 HTTP 서버를 통해 열어주세요.<br>예: <code>python3 -m http.server 8080</code></p>
    </div>
  </div>

  <!-- ── Top filter bar ─────────────────────────────────── -->
  <div class="fixed top-0 left-0 right-0 z-10 px-3 pt-safe-top pt-3 pb-0 pointer-events-none">
    <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-md px-3 py-2 pointer-events-auto">
      <div id="filter-bar" class="flex gap-2 overflow-x-auto no-scrollbar">
        <button class="filter-btn active text-sm px-3 py-1.5 rounded-full border border-blue-600"     data-category="전체">전체</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="음식점">음식점</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="카페">카페</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="마트/편의점">마트</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="의료">의료</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="미용">미용</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="교육">교육</button>
        <button class="filter-btn        text-sm px-3 py-1.5 rounded-full border border-gray-300 text-gray-700" data-category="기타">기타</button>
      </div>
    </div>
  </div>

  <!-- ── FAB: current location ──────────────────────────── -->
  <button id="location-btn"
    class="fixed bottom-6 right-4 z-10 bg-white shadow-lg rounded-full w-12 h-12 flex items-center justify-center hover:bg-gray-50 active:scale-95 transition-all"
    title="현재 위치로 이동">
    <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M2 12h2m16 0h2"/>
    </svg>
  </button>

  <!-- ── Bottom detail panel ────────────────────────────── -->
  <div id="bottom-panel" class="fixed bottom-0 left-0 right-0 z-20 bg-white rounded-t-2xl shadow-2xl max-h-[75vh] flex flex-col select-none">
    <!-- drag handle / tap-to-close -->
    <div id="panel-handle" class="flex justify-center pt-3 pb-2 cursor-pointer flex-shrink-0">
      <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
    </div>
    <!-- scrollable content -->
    <div id="panel-content" class="overflow-y-auto flex-1 px-4 pb-8"></div>
  </div>

  <!-- ── Loading overlay ────────────────────────────────── -->
  <div id="loading" class="fixed inset-0 bg-white/90 z-30 flex flex-col items-center justify-center gap-3">
    <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full spin-anim"></div>
    <p id="loading-text" class="text-gray-600 text-sm font-medium">초기화 중...</p>
  </div>

  <!-- ── Error toast ────────────────────────────────────── -->
  <div id="error-toast" class="fixed top-20 left-4 right-4 z-40 bg-red-50 border border-red-200 rounded-xl px-4 py-3 shadow-lg hidden transition-opacity">
    <p id="error-text" class="text-red-700 text-sm"></p>
  </div>


  <script>
  // ═══════════════════════════════════════════════════════════
  //  CONSTANTS & STATE
  // ═══════════════════════════════════════════════════════════
  const SUWON_CENTER = { lat: 37.2636, lng: 127.0286 };
  const DEFAULT_ZOOM = 13;
  const CLUSTER_ZOOM_THRESHOLD = 14; // below this zoom → cluster
  const MAX_VISIBLE_MARKERS = 600;   // cap individual markers for perf

  const CATEGORY_COLORS = {
    '음식점':    '#ef4444',
    '카페':      '#f59e0b',
    '마트/편의점': '#22c55e',
    '의료':      '#3b82f6',
    '미용':      '#a855f7',
    '교육':      '#f97316',
    '기타':      '#6b7280',
  };

  // keyword → category map (longest-match wins)
  const CATEGORY_KEYWORDS = [
    ['카페',       ['카페', '커피', '베이커리', '빵집', '디저트', '아이스크림', '제과', '케이크']],
    ['마트/편의점', ['마트', '슈퍼', '편의점', '식료품', '유통', '소매', '잡화']],
    ['의료',       ['병원', '의원', '약국', '치과', '한의원', '안과', '이비인후과', '피부과', '정형외과',
                    '내과', '소아과', '산부인과', '비뇨기과', '외과', '의료', '클리닉']],
    ['미용',       ['미용', '헤어', '네일', '피부', '마사지', '스파', '뷰티', '이발', '살롱']],
    ['교육',       ['학원', '교습소', '유치원', '어린이집', '교육', '학교', '스쿨']],
    ['음식점',     ['음식점', '한식', '중식', '일식', '양식', '분식', '치킨', '피자', '햄버거',
                    '패스트푸드', '족발', '보쌈', '냉면', '국밥', '갈비', '삼겹살', '해산물',
                    '횟집', '식당', '밥집', '국수', '도시락', '순대', '떡볶이', '쌀국수']],
  ];

  function getCategory(industryName) {
    if (!industryName) return '기타';
    const lower = industryName.toLowerCase();
    for (const [cat, keywords] of CATEGORY_KEYWORDS) {
      if (keywords.some(kw => lower.includes(kw))) return cat;
    }
    return '기타';
  }

  // App state
  const state = {
    map: null,
    merchants: [],           // all loaded merchants with coords
    activeMarkers: [],       // {naverMarker, merchant} currently on map
    clusterMarkers: [],      // cluster overlay markers
    selectedCategory: '전체',
    selectedMerchant: null,
    geocodeCache: {},        // address → {lat, lng}
  };

  // ═══════════════════════════════════════════════════════════
  //  UTILITY
  // ═══════════════════════════════════════════════════════════
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function setLoading(visible, text) {
    const el = document.getElementById('loading');
    const tx = document.getElementById('loading-text');
    el.style.display = visible ? 'flex' : 'none';
    if (text !== undefined) tx.textContent = text;
  }

  let _errTimer;
  function showError(msg, ms = 5000) {
    const t = document.getElementById('error-toast');
    document.getElementById('error-text').textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(_errTimer);
    _errTimer = setTimeout(() => t.classList.add('hidden'), ms);
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ═══════════════════════════════════════════════════════════
  //  NAVER MAPS SDK LOADER
  // ═══════════════════════════════════════════════════════════
  function loadNaverSDK(clientId) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = `https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=${encodeURIComponent(clientId)}`;
      s.onload = resolve;
      s.onerror = () => reject(new Error('네이버 지도 SDK를 불러올 수 없습니다.'));
      document.head.appendChild(s);
    });
  }

  // ═══════════════════════════════════════════════════════════
  //  MAP INIT
  // ═══════════════════════════════════════════════════════════
  function initMap() {
    state.map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(SUWON_CENTER.lat, SUWON_CENTER.lng),
      zoom: DEFAULT_ZOOM,
      mapTypeId: naver.maps.MapTypeId.NORMAL,
      mapDataControl: false,
      logoControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
      scaleControlOptions: { position: naver.maps.Position.BOTTOM_LEFT },
    });
    naver.maps.Event.addListener(state.map, 'idle', renderMarkers);
  }

  // ═══════════════════════════════════════════════════════════
  //  PUBLIC DATA API
  // ═══════════════════════════════════════════════════════════
  async function fetchMerchantsPage(sigunNm, page, pageSize) {
    const apiUrl =
      `https://openapi.gg.go.kr/RegionMnyFacltStus` +
      `?KEY=${encodeURIComponent(CONFIG.GGDATA_API_KEY)}` +
      `&Type=json&pIndex=${page}&pSize=${pageSize}` +
      `&SIGUN_NM=${encodeURIComponent(sigunNm)}`;

    const fetchUrl = CONFIG.CORS_PROXY
      ? CONFIG.CORS_PROXY + encodeURIComponent(apiUrl)
      : apiUrl;

    const res = await fetch(fetchUrl);
    if (!res.ok) throw new Error(`공공데이터 API HTTP ${res.status}`);

    const raw = await res.json();
    // allorigins.win wraps response in { contents: "..." }
    const json = raw.contents ? JSON.parse(raw.contents) : raw;

    const body = json.RegionMnyFacltStus;
    if (!body) {
      // API may return error message
      const errCode = json?.RESULT?.CODE ?? json?.result?.code ?? 'UNKNOWN';
      throw new Error(`공공데이터 API 오류 (${errCode})`);
    }

    const totalCount = body[0]?.head?.[0]?.list_total_count ?? 0;
    const rows = body[1]?.row ?? [];
    return { rows, totalCount };
  }

  async function loadAllMerchants(sigunNm) {
    const PAGE_SIZE = 1000;
    setLoading(true, '가맹점 목록 불러오는 중...');

    const first = await fetchMerchantsPage(sigunNm, 1, PAGE_SIZE);
    let rows = [...first.rows];
    const total = first.totalCount;
    const totalPages = Math.min(Math.ceil(total / PAGE_SIZE), 20); // hard cap 20 pages

    for (let p = 2; p <= totalPages; p++) {
      setLoading(true, `가맹점 목록 불러오는 중... (${p}/${totalPages}페이지)`);
      const { rows: more } = await fetchMerchantsPage(sigunNm, p, PAGE_SIZE);
      rows = rows.concat(more);
      await sleep(150);
    }
    return rows;
  }

  // ═══════════════════════════════════════════════════════════
  //  GEOCODING (Kakao Address Search)
  // ═══════════════════════════════════════════════════════════
  async function geocode(address) {
    if (state.geocodeCache[address]) return state.geocodeCache[address];

    const url = `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(address)}`;
    const res = await fetch(url, {
      headers: { Authorization: `KakaoAK ${CONFIG.KAKAO_REST_API_KEY}` },
    });
    if (!res.ok) return null;

    const data = await res.json();
    const doc = data.documents?.[0];
    if (!doc) return null;

    const coords = { lat: parseFloat(doc.y), lng: parseFloat(doc.x) };
    state.geocodeCache[address] = coords;

    // Persist cache (best-effort — localStorage may be unavailable)
    try {
      localStorage.setItem('geoCache_v1', JSON.stringify(state.geocodeCache));
    } catch (_) { /* quota exceeded — ignore */ }

    return coords;
  }

  // ═══════════════════════════════════════════════════════════
  //  PROCESS RAW ROWS → merchant objects
  // ═══════════════════════════════════════════════════════════
  async function processRows(rows) {
    // Restore geocode cache from localStorage
    try {
      const cached = localStorage.getItem('geoCache_v1');
      if (cached) state.geocodeCache = JSON.parse(cached);
    } catch (_) {}

    const merchants = [];
    let needsGeocode = 0;

    // First pass: use embedded coordinates
    const pending = [];
    for (const row of rows) {
      const lat = parseFloat(row.REFINE_WGS84_LAT);
      const lng = parseFloat(row.REFINE_WGS84_LOGT);
      const addr = row.REFINE_ROADNM_ADDR || row.REFINE_LOTNO_ADDR || '';
      const name = row.BIZPLC_NM || '이름 없음';
      const industryName = row.INDUTY_NM || '';

      if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
        merchants.push({
          name, industryName, addr,
          sigunNm: row.SIGUN_NM || '',
          category: getCategory(industryName),
          lat, lng,
        });
      } else if (addr) {
        pending.push({ row, name, industryName, addr });
        needsGeocode++;
      }
    }

    // Second pass: geocode missing
    if (needsGeocode > 0 && CONFIG.KAKAO_REST_API_KEY && CONFIG.KAKAO_REST_API_KEY !== 'YOUR_KAKAO_REST_API_KEY') {
      const BATCH = 5;
      let done = 0;
      for (let i = 0; i < pending.length; i += BATCH) {
        setLoading(true, `주소 좌표 변환 중... (${done}/${needsGeocode})`);
        const batch = pending.slice(i, i + BATCH);
        await Promise.all(batch.map(async ({ row, name, industryName, addr }) => {
          const coords = await geocode(addr).catch(() => null);
          done++;
          if (coords) {
            merchants.push({
              name, industryName, addr,
              sigunNm: row.SIGUN_NM || '',
              category: getCategory(industryName),
              lat: coords.lat,
              lng: coords.lng,
            });
          }
        }));
        await sleep(100);
      }
    }

    return merchants;
  }

  // ═══════════════════════════════════════════════════════════
  //  MARKER ICON
  // ═══════════════════════════════════════════════════════════
  function markerIcon(category) {
    const color = CATEGORY_COLORS[category] || CATEGORY_COLORS['기타'];
    return {
      content: `<div style="
        width:22px;height:22px;background:${color};
        border:2.5px solid white;border-radius:50%;
        box-shadow:0 2px 5px rgba(0,0,0,.35);cursor:pointer;
      "></div>`,
      size: new naver.maps.Size(22, 22),
      anchor: new naver.maps.Point(11, 11),
    };
  }

  function clusterIcon(count) {
    const size = count < 10 ? 34 : count < 50 ? 40 : count < 200 ? 48 : 56;
    const alpha = Math.min(0.92, 0.55 + count / 300);
    return {
      content: `<div style="
        width:${size}px;height:${size}px;
        background:rgba(37,99,235,${alpha.toFixed(2)});
        border:2px solid white;border-radius:50%;
        display:flex;align-items:center;justify-content:center;
        color:white;font-size:${size < 40 ? 11 : 13}px;font-weight:700;
        box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;
      ">${count > 999 ? '999+' : count}</div>`,
      size: new naver.maps.Size(size, size),
      anchor: new naver.maps.Point(size / 2, size / 2),
    };
  }

  // ═══════════════════════════════════════════════════════════
  //  RENDER MARKERS  (called on every map idle)
  // ═══════════════════════════════════════════════════════════
  function renderMarkers() {
    if (!state.map || state.merchants.length === 0) return;

    const bounds = state.map.getBounds();
    const zoom = state.map.getZoom();

    // Filter by category
    const visible = state.merchants.filter(m => {
      if (state.selectedCategory !== '전체' && m.category !== state.selectedCategory) return false;
      return bounds.hasLatLng(new naver.maps.LatLng(m.lat, m.lng));
    });

    // Clear all existing
    state.activeMarkers.forEach(({ naverMarker }) => naverMarker.setMap(null));
    state.activeMarkers = [];
    state.clusterMarkers.forEach(m => m.setMap(null));
    state.clusterMarkers = [];

    if (zoom >= CLUSTER_ZOOM_THRESHOLD) {
      renderIndividual(visible);
    } else {
      renderClustered(visible, zoom);
    }
  }

  function renderIndividual(merchants) {
    const capped = merchants.slice(0, MAX_VISIBLE_MARKERS);
    capped.forEach(m => {
      const nm = new naver.maps.Marker({
        position: new naver.maps.LatLng(m.lat, m.lng),
        map: state.map,
        icon: markerIcon(m.category),
        title: m.name,
      });
      naver.maps.Event.addListener(nm, 'click', () => openPanel(m));
      state.activeMarkers.push({ naverMarker: nm, merchant: m });
    });
  }

  function renderClustered(merchants, zoom) {
    // Grid size in lat/lng degrees — coarser at lower zoom
    const gridDeg = zoom < 9 ? 0.15 : zoom < 11 ? 0.06 : zoom < 12 ? 0.03 : 0.015;
    const grid = new Map();

    merchants.forEach(m => {
      const gx = Math.floor(m.lng / gridDeg);
      const gy = Math.floor(m.lat / gridDeg);
      const key = `${gx}:${gy}`;
      if (!grid.has(key)) grid.set(key, []);
      grid.get(key).push(m);
    });

    grid.forEach(group => {
      const avgLat = group.reduce((s, m) => s + m.lat, 0) / group.length;
      const avgLng = group.reduce((s, m) => s + m.lng, 0) / group.length;
      const count = group.length;

      const nm = new naver.maps.Marker({
        position: new naver.maps.LatLng(avgLat, avgLng),
        map: state.map,
        icon: count === 1 ? markerIcon(group[0].category) : clusterIcon(count),
        title: count === 1 ? group[0].name : `${count}개 가맹점`,
      });

      naver.maps.Event.addListener(nm, 'click', () => {
        if (count === 1) {
          openPanel(group[0]);
        } else {
          state.map.setCenter(new naver.maps.LatLng(avgLat, avgLng));
          state.map.setZoom(Math.min(state.map.getZoom() + 2, 18));
        }
      });
      state.clusterMarkers.push(nm);
    });
  }


  // ═══════════════════════════════════════════════════════════
  //  BOTTOM PANEL
  // ═══════════════════════════════════════════════════════════
  function openPanel(merchant) {
    state.selectedMerchant = merchant;
    const content = document.getElementById('panel-content');
    content.innerHTML = renderBasicInfo(merchant);
    document.getElementById('bottom-panel').classList.add('open');

    // Async: enrich with Kakao Local details
    if (CONFIG.KAKAO_REST_API_KEY && CONFIG.KAKAO_REST_API_KEY !== 'YOUR_KAKAO_REST_API_KEY') {
      enrichWithKakao(merchant).catch(() => {
        const loadingEl = document.getElementById('kakao-loading');
        if (loadingEl) loadingEl.remove();
      });
    } else {
      const loadingEl = document.getElementById('kakao-loading');
      if (loadingEl) loadingEl.remove();
    }
  }

  function closePanel() {
    document.getElementById('bottom-panel').classList.remove('open');
    state.selectedMerchant = null;
  }

  function renderBasicInfo(m) {
    const color = CATEGORY_COLORS[m.category] || CATEGORY_COLORS['기타'];
    const naverUrl =
      `https://map.naver.com/v5/search/${encodeURIComponent(m.name + ' ' + m.addr)}`;

    return `
    <div>
      <!-- Header row -->
      <div class="flex items-start gap-2 mb-3">
        <div class="flex-1 min-w-0">
          <h2 class="text-lg font-bold text-gray-900 leading-tight truncate">${esc(m.name)}</h2>
          <div class="flex flex-wrap items-center gap-1.5 mt-1">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold text-white"
                  style="background:${color}">${esc(m.category)}</span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
              ✓ 경기지역화폐 가맹
            </span>
          </div>
        </div>
        <button onclick="closePanel()"
          class="flex-shrink-0 text-gray-300 hover:text-gray-500 -mt-0.5 p-1">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Address -->
      <div class="flex items-start gap-2 text-sm text-gray-600 mb-2">
        <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>${esc(m.addr)}</span>
      </div>

      <!-- Industry name -->
      ${m.industryName ? `
      <div class="flex items-center gap-2 text-sm text-gray-500 mb-4">
        <svg class="w-4 h-4 flex-shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
        </svg>
        <span>${esc(m.industryName)}</span>
      </div>` : '<div class="mb-4"></div>'}

      <!-- Kakao detail placeholder -->
      <div id="kakao-loading" class="flex items-center gap-2 text-xs text-gray-400 mb-4">
        <div class="w-3 h-3 border-2 border-gray-300 border-t-gray-400 rounded-full spin-anim"></div>
        상세정보 조회 중...
      </div>

      <!-- Action buttons -->
      <div id="action-buttons" class="flex gap-2">
        <a id="btn-naver" href="${naverUrl}" target="_blank" rel="noopener noreferrer"
          class="flex-1 flex items-center justify-center gap-1.5 bg-green-500 hover:bg-green-600 text-white text-sm font-medium py-3 rounded-xl transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
          네이버 플레이스
        </a>
      </div>
    </div>`;
  }

  async function enrichWithKakao(merchant) {
    const url =
      `https://dapi.kakao.com/v2/local/search/keyword.json` +
      `?query=${encodeURIComponent(merchant.name)}` +
      `&y=${merchant.lat}&x=${merchant.lng}&radius=300&size=1`;

    const res = await fetch(url, {
      headers: { Authorization: `KakaoAK ${CONFIG.KAKAO_REST_API_KEY}` },
    });
    if (!res.ok) throw new Error('kakao error');

    const data = await res.json();
    const doc = data.documents?.[0];

    // Remove loading indicator regardless
    const loadingEl = document.getElementById('kakao-loading');
    if (loadingEl) loadingEl.remove();

    if (!doc) return; // no match — basic info already shown

    const phone = doc.phone || '';
    const category = doc.category_name || '';
    const placeUrl = doc.place_url || '';

    // Insert phone row if available
    if (phone) {
      const addrEl = document.querySelector('#panel-content .flex.items-start.gap-2.text-sm.text-gray-600');
      if (addrEl) {
        const phoneRow = document.createElement('div');
        phoneRow.className = 'flex items-center gap-2 text-sm text-gray-600 mb-2';
        phoneRow.innerHTML = `
          <svg class="w-4 h-4 flex-shrink-0 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          <a href="tel:${esc(phone)}" class="text-blue-600 hover:underline">${esc(phone)}</a>`;
        addrEl.insertAdjacentElement('afterend', phoneRow);
      }
    }

    // Add Kakao category detail (if meaningful)
    if (category) {
      const catParts = category.split(' > ');
      const detail = catParts[catParts.length - 1];
      const industryEl = document.querySelector('#panel-content .text-gray-500.text-sm');
      if (industryEl && detail) {
        const tag = document.createElement('span');
        tag.className = 'ml-1.5 text-xs text-gray-400';
        tag.textContent = `(${detail})`;
        industryEl.querySelector('span')?.append(tag);
      }
    }

    // Add phone button to action area
    if (phone) {
      const btnContainer = document.getElementById('action-buttons');
      if (btnContainer) {
        const phoneBtn = document.createElement('a');
        phoneBtn.href = `tel:${esc(phone)}`;
        phoneBtn.className =
          'flex items-center justify-center gap-1.5 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium py-3 px-4 rounded-xl transition-colors';
        phoneBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.948V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          전화하기`;
        btnContainer.insertBefore(phoneBtn, btnContainer.firstChild);
        // Make naver button no longer flex-1 so it doesn't stretch
        document.getElementById('btn-naver')?.classList.remove('flex-1');
      }
    }
  }

  // ═══════════════════════════════════════════════════════════
  //  EVENT WIRING
  // ═══════════════════════════════════════════════════════════
  function setupFilters() {
    document.getElementById('filter-bar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.selectedCategory = btn.dataset.category;
      renderMarkers();
    });
  }

  function setupLocationButton() {
    document.getElementById('location-btn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        showError('이 브라우저에서는 위치 정보를 지원하지 않습니다.');
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.map.setCenter(new naver.maps.LatLng(pos.coords.latitude, pos.coords.longitude));
          state.map.setZoom(15);
        },
        () => showError('위치 정보를 가져올 수 없습니다. 브라우저 권한을 확인해주세요.')
      );
    });
  }

  function setupPanel() {
    document.getElementById('panel-handle').addEventListener('click', closePanel);

    // Swipe-down to close
    let touchStartY = 0;
    const panel = document.getElementById('bottom-panel');
    panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
    panel.addEventListener('touchend', e => {
      if (e.changedTouches[0].clientY - touchStartY > 70) closePanel();
    }, { passive: true });
  }

  // ═══════════════════════════════════════════════════════════
  //  MAIN
  // ═══════════════════════════════════════════════════════════
  async function main() {
    // Guard: config must exist
    if (typeof CONFIG === 'undefined') {
      setLoading(false);
      showError('config.js 파일을 찾을 수 없습니다.', 0);
      return;
    }

    // Guard: Naver Map key
    if (!CONFIG.NAVER_MAP_CLIENT_ID || CONFIG.NAVER_MAP_CLIENT_ID === 'YOUR_NAVER_MAP_CLIENT_ID') {
      setLoading(false);
      document.getElementById('config-error').style.display = 'flex';
      return;
    }

    try {
      setLoading(true, '지도 초기화 중...');
      await loadNaverSDK(CONFIG.NAVER_MAP_CLIENT_ID);
      initMap();
      setupFilters();
      setupLocationButton();
      setupPanel();

      // Guard: public data key
      if (!CONFIG.GGDATA_API_KEY || CONFIG.GGDATA_API_KEY === 'YOUR_GGDATA_API_KEY') {
        setLoading(false);
        showError('GGDATA_API_KEY가 설정되지 않았습니다. config.js를 확인해주세요.', 0);
        return;
      }

      const sigunNm = CONFIG.DEFAULT_SIGUN || '수원시';
      const rows = await loadAllMerchants(sigunNm);

      setLoading(true, `좌표 처리 중... (총 ${rows.length}개 가맹점)`);
      const merchants = await processRows(rows);

      state.merchants = merchants;
      setLoading(false);
      renderMarkers();

      console.info(`[GPF] 로드 완료: ${merchants.length}개 가맹점 (${sigunNm})`);

    } catch (err) {
      setLoading(false);
      console.error('[GPF]', err);
      showError(`오류: ${err.message}`, 0);
    }
  }

  main();
  </script>
</body>
</html>
